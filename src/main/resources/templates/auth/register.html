<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrati')}"></head>
<body>
<div class="public">
    <section class="public-side">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#i-jar"/></svg></span>
            Smart Pantry
        </a>
        <div>
            <h1>Meno sprechi, a partire da oggi.</h1>
            <p class="lead">Dopo la registrazione potrai indicare allergie e preferenze alimentari:
                le useremo per suggerirti le ricette giuste.</p>
        </div>
        <div></div>
    </section>

    <main class="public-main">
        <div class="auth-card">
            <h2>Crea un account</h2>
            <p class="sub">Bastano pochi secondi.</p>

            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="flash flash-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                    <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#i-alert"/></svg>
                    <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">Errore</span>
                </div>

                <div class="field">
                    <label for="username">Nome utente</label>
                    <input class="input" id="username" type="text" th:field="*{username}" autocomplete="username"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" required>
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" id="email" type="email" th:field="*{email}" autocomplete="email"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" id="password" type="password" th:field="*{password}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" required>
                    <span class="hint">Almeno 8 caratteri.</span>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="field">
                    <label for="confirmPassword">Ripeti la password</label>
                    <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}"
                           autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" required>
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>
                <div class="form-actions">
                    <button class="btn btn-block" type="submit">Crea account</button>
                </div>
            </form>

            <p class="switch">Hai già un account? <a th:href="@{/login}">Accedi</a></p>
        </div>
    </main>
</div>
</body>
</html>

spring.application.name=smart-pantry

# ===== Database MySQL =====
# createDatabaseIfNotExist=true crea lo schema smart_pantry_db se non esiste ancora
spring.datasource.url=jdbc:mysql://localhost:3307/smart_pantry_db?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
# le tabelle vengono create dallo script schema.sql (vedi cartella resources)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.open-in-view=false



# ===== Intelligenza artificiale (Groq) =====
# la chiave NON va scritta qui: viene letta dalla variabile d'ambiente GROQ_API_KEY
spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.4
# in caso di errore non riprova all'infinito: al massimo 2 tentativi
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=5s
# Groq offre solo la chat: disattiviamo gli altri modelli OpenAI
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ===== Varie =====
server.port=8080
spring.thymeleaf.cache=false
server.servlet.session.timeout=60m


   # ===== Versioni dei file statici =====
   # il browser scarica sempre la versione aggiornata di CSS e JS
   spring.web.resources.chain.strategy.content.enabled=true
   spring.web.resources.chain.strategy.content.paths=/**